name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.0
          cache: pnpm

      - name: Check public repository hygiene
        run: node scripts/check-public-repo.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check architecture boundaries
        run: pnpm check:architecture

      - name: Check test runtime capabilities
        run: pnpm check:test-runtime

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Check preinstalled Google Chrome
        run: google-chrome --version

      - name: Run Web end-to-end tests
        run: pnpm test:e2e
        env:
          CE_PLAYWRIGHT_BROWSER_CHANNEL: chrome

      - name: Install the latest stable Codex CLI
        run: |
          npm install --global @openai/codex@latest
          codex --version | tee codex-version.txt
          echo "### App-server contract baseline" >> "${GITHUB_STEP_SUMMARY}"
          cat codex-version.txt >> "${GITHUB_STEP_SUMMARY}"

      - name: Run real app-server contract tests
        run: pnpm test:app-server

      - name: Check deployment scripts
        run: sh -n deploy/hpc/*.sh deploy/release/*.sh

      - name: Build
        run: pnpm build

      - name: Enforce Web bundle budget and lazy boundaries
        run: pnpm check:web-budget

      - name: Require the tag commit to belong to main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

  artifacts:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build immutable release assets
        run: deploy/release/prepare-release-assets.sh "${RUNNER_TEMP}/release" "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-everywhere-${{ github.ref_name }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*

  publish:
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-everywhere-${{ github.ref_name }}
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists"
            exit 0
          fi

          prerelease=()
          if [[ "${tag}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "CodexEverywhere ${tag}" \
            "${prerelease[@]}" \
            release/*
