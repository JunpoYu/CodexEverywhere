name: Feature request
description: 提议符合项目边界的新能力或体验优化
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 说明实际使用场景和当前阻碍，不要包含真实部署信息
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望交互、边界和可接受的取舍
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 项目范围
      options:
        - label: 该建议不要求收集 SSH 密码、共享 Linux/Codex 身份、实现 Web Terminal 或替代 HPC 调度器。
          required: true
