# Direct host ingress. Replace placeholders before enabling this file.
# The Agent listens on loopback; Nginx is the only HTTPS/WSS entry point.

server {
    listen 80;
    listen [::]:80;
    server_name __DIRECT_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://__DIRECT_HOST__$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DIRECT_HOST__;

    ssl_certificate /etc/letsencrypt/live/__DIRECT_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DIRECT_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CodexEverywhereDirectSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location = /.well-known/codex-everywhere {
        proxy_pass http://127.0.0.1:__AGENT_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /gateway {
        proxy_pass http://127.0.0.1:__AGENT_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Optional self-hosted PWA. Use the same origin configured by
    # `ce auth configure` so Passkeys remain valid.
    root __PWA_ROOT__;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
}
