<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">CodexEverywhere 连接架构</title>
  <desc id="desc">浏览器优先通过 Direct 连接用户 Agent，也可以通过仅转发端到端密文的 Relay 连接。Agent 通过私有 Unix socket 访问 Codex app-server，SSH TUI 连接同一个 app-server。</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#f0eee8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#8b93a3"/>
    </marker>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#20242c" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="430" rx="28" fill="url(#panel)"/>
  <text x="54" y="54" fill="#242933" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="750">连接路径</text>
  <text x="54" y="80" fill="#747b86" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Direct 优先；网络受限时，Relay 只看到路由元数据和端到端密文。</text>

  <path d="M270 186C390 104 496 104 610 166" fill="none" stroke="#e36a3d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="387" y="113" fill="#a94e2d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">Direct WSS + Noise</text>
  <path d="M270 234C355 292 395 294 470 248" fill="none" stroke="#8b93a3" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M590 235C626 219 640 205 664 193" fill="none" stroke="#8b93a3" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="348" y="315" fill="#747b86" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">可选 E2EE Relay 路径</text>
  <path d="M810 190h104" fill="none" stroke="#8b93a3" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1045 284v-52" fill="none" stroke="#8b93a3" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="54" y="143" width="216" height="132" rx="18" fill="#ffffff"/>
    <rect x="76" y="166" width="44" height="44" rx="12" fill="#20242c"/>
    <rect x="84" y="174" width="28" height="20" rx="3" fill="#f5f3ee"/>
    <rect x="94" y="198" width="8" height="3" rx="1.5" fill="#e36a3d"/>
    <text x="136" y="184" fill="#242933" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="750">Web / PWA</text>
    <text x="136" y="205" fill="#747b86" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">手机与桌面浏览器</text>
    <text x="76" y="247" fill="#4f5661" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">Passkey · 专用密码 · 临时模式</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="174" width="120" height="92" rx="18" fill="#ffffff"/>
    <circle cx="530" cy="205" r="14" fill="#e8ebf3"/>
    <path d="M518 205h24M530 193v24" stroke="#66758f" stroke-width="2"/>
    <text x="504" y="242" fill="#242933" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="750">Relay</text>
    <text x="492" y="258" fill="#747b86" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9">可选 · 无业务状态</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="664" y="128" width="146" height="138" rx="18" fill="#20242c"/>
    <rect x="686" y="150" width="38" height="38" rx="10" fill="#f5f3ee"/>
    <path d="M696 160h18v5h-13v8h13v5h-18z" fill="#20242c"/>
    <circle cx="714" cy="175" r="3" fill="#e36a3d"/>
    <text x="686" y="215" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="750">用户 Agent</text>
    <text x="686" y="235" fill="#b7beca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">运行于用户自己的 UID</text>
    <text x="686" y="251" fill="#b7beca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">鉴权 · Queue · 生命周期</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="914" y="128" width="262" height="138" rx="18" fill="#ffffff"/>
    <rect x="936" y="151" width="42" height="42" rx="10" fill="#fff0e8"/>
    <path d="M947 162h20v5h-15v9h15v5h-20z" fill="#e36a3d"/>
    <text x="992" y="171" fill="#242933" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="750">Codex app-server</text>
    <text x="992" y="191" fill="#747b86" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">thread / turn 的唯一事实源</text>
    <rect x="936" y="215" width="218" height="28" rx="8" fill="#f0eee8"/>
    <text x="958" y="233" fill="#5c626c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">private Unix socket</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="914" y="302" width="262" height="76" rx="16" fill="#ffffff"/>
    <rect x="936" y="320" width="40" height="40" rx="9" fill="#e9edf5"/>
    <path d="M946 331l7 7-7 7m11 0h10" fill="none" stroke="#586b91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="992" y="333" fill="#242933" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="750">SSH · ce tui</text>
    <text x="992" y="352" fill="#747b86" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">接力同一个活动会话</text>
  </g>

  <rect x="696" y="302" width="176" height="76" rx="16" fill="#fff5ee" stroke="#f0d2c1"/>
  <text x="716" y="330" fill="#9b4b2d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="750">数据留在宿主机</text>
  <text x="716" y="350" fill="#715d54" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9">Workspace · 凭据 · Queue</text>
  <text x="716" y="365" fill="#715d54" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9">均受 Unix 用户边界保护</text>
</svg>
