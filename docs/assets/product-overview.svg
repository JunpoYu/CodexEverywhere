<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">CodexEverywhere 产品界面概览</title>
  <desc id="desc">桌面浏览器和手机同时访问运行在 Linux 或 HPC 上的同一个 Codex 会话，界面包含工作区、消息、工具活动、审批和队列。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#172033"/>
      <stop offset="1" stop-color="#2b1d19"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e36a3d"/>
      <stop offset="1" stop-color="#f2a36f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#05070c" flood-opacity="0.38"/>
    </filter>
    <filter id="phoneShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#05070c" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1440" height="820" rx="32" fill="url(#bg)"/>
  <circle cx="1230" cy="95" r="250" fill="#e36a3d" opacity="0.08"/>
  <circle cx="140" cy="750" r="260" fill="#5a7be7" opacity="0.07"/>

  <g transform="translate(72 54)">
    <rect width="50" height="50" rx="12" fill="#f5f3ee"/>
    <path d="M13 14h25v6H19v12h19v6H13z" fill="#111827"/>
    <circle cx="37" cy="35" r="4" fill="#e36a3d"/>
    <text x="68" y="23" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">CodexEverywhere</text>
    <text x="68" y="45" fill="#aeb7c9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">同一个 Codex，会话随你移动</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="130" width="970" height="620" rx="20" fill="#f7f6f2"/>
    <rect x="72" y="130" width="970" height="48" rx="20" fill="#23262c"/>
    <rect x="72" y="158" width="970" height="20" fill="#23262c"/>
    <circle cx="99" cy="154" r="5" fill="#ed6a5e"/>
    <circle cx="117" cy="154" r="5" fill="#f4bf4f"/>
    <circle cx="135" cy="154" r="5" fill="#61c554"/>
    <rect x="340" y="142" width="430" height="24" rx="12" fill="#32363e"/>
    <circle cx="359" cy="154" r="4" fill="#66c18c"/>
    <text x="373" y="159" fill="#cbd1dc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">codex.example.com · 已加密连接</text>

    <rect x="72" y="178" width="220" height="572" fill="#eceae4"/>
    <text x="94" y="211" fill="#69707c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1">WORKSPACES</text>
    <rect x="86" y="226" width="192" height="42" rx="10" fill="#ffffff"/>
    <rect x="98" y="237" width="20" height="20" rx="5" fill="#e36a3d"/>
    <text x="128" y="253" fill="#242933" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">climate-model</text>
    <text x="94" y="298" fill="#69707c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1">THREADS</text>
    <rect x="86" y="312" width="192" height="58" rx="10" fill="#dfddd7"/>
    <rect x="96" y="324" width="4" height="34" rx="2" fill="#e36a3d"/>
    <text x="110" y="338" fill="#242933" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">检查训练结果</text>
    <text x="110" y="354" fill="#7c828c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">刚刚 · 正在运行</text>
    <text x="100" y="399" fill="#434954" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">优化数据加载脚本</text>
    <text x="100" y="426" fill="#434954" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">解释评估指标</text>
    <rect x="88" y="685" width="188" height="40" rx="10" fill="#242933"/>
    <text x="126" y="710" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">＋ 新建会话</text>

    <rect x="292" y="178" width="750" height="54" fill="#ffffff"/>
    <text x="318" y="202" fill="#20242c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">检查训练结果</text>
    <text x="318" y="219" fill="#7d838d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">/public/projects/climate-model</text>
    <rect x="790" y="190" width="106" height="28" rx="14" fill="#f0f5f2"/>
    <circle cx="808" cy="204" r="4" fill="#53a775"/>
    <text x="820" y="208" fill="#37734f" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="650">实时连接</text>
    <rect x="906" y="190" width="112" height="28" rx="14" fill="#f6eee9"/>
    <text x="922" y="208" fill="#a85332" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="650">无需审批</text>

    <rect x="292" y="232" width="750" height="420" fill="#faf9f6"/>
    <rect x="318" y="255" width="500" height="48" rx="12" fill="#eceae4"/>
    <text x="338" y="275" fill="#333942" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650">你</text>
    <text x="338" y="291" fill="#545b66" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">检查最新训练结果，并找出验证损失上升的原因。</text>

    <circle cx="336" cy="337" r="18" fill="#242933"/>
    <path d="M327 328h18v5h-13v8h13v5h-18z" fill="#f5f3ee"/>
    <circle cx="344" cy="343" r="3" fill="#e36a3d"/>
    <text x="366" y="335" fill="#20242c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">Codex</text>
    <text x="366" y="355" fill="#4e5661" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">我先读取训练日志和评估脚本，再比较最近三个 checkpoint。</text>

    <rect x="366" y="375" width="618" height="82" rx="12" fill="#20242c"/>
    <circle cx="388" cy="398" r="6" fill="#67d391"/>
    <text x="406" y="402" fill="#f3f4f6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">python scripts/evaluate.py --latest</text>
    <text x="388" y="428" fill="#9ea8b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">best checkpoint: epoch_18 · val_loss 0.184</text>
    <text x="388" y="445" fill="#9ea8b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">latest checkpoint: epoch_24 · val_loss 0.231</text>

    <rect x="366" y="473" width="618" height="90" rx="12" fill="#fff4ea" stroke="#f2d2bc"/>
    <rect x="382" y="489" width="30" height="30" rx="8" fill="#e36a3d"/>
    <path d="M391 504h12M397 498v12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="426" y="500" fill="#8d4026" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">需要命令审批</text>
    <text x="426" y="518" fill="#6c554b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">读取共享结果目录中的 TensorBoard event 文件</text>
    <rect x="824" y="526" width="70" height="24" rx="8" fill="#ffffff" stroke="#dec0ae"/>
    <text x="845" y="542" fill="#77584a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="650">拒绝</text>
    <rect x="902" y="526" width="66" height="24" rx="8" fill="#e36a3d"/>
    <text x="918" y="542" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="650">允许</text>

    <rect x="292" y="652" width="750" height="98" fill="#ffffff"/>
    <rect x="318" y="670" width="700" height="58" rx="14" fill="#f1f0ec" stroke="#dedbd4"/>
    <text x="338" y="694" fill="#8a8f97" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">继续告诉 Codex…</text>
    <rect x="950" y="682" width="52" height="34" rx="10" fill="#e36a3d"/>
    <path d="M968 699h15m-6-6 6 6-6 6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#phoneShadow)">
    <rect x="1070" y="112" width="290" height="638" rx="42" fill="#171a20"/>
    <rect x="1080" y="122" width="270" height="618" rx="34" fill="#f7f6f2"/>
    <rect x="1166" y="132" width="98" height="22" rx="11" fill="#171a20"/>
    <text x="1102" y="188" fill="#20242c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">检查训练结果</text>
    <circle cx="1319" cy="183" r="5" fill="#55ad79"/>
    <rect x="1102" y="210" width="226" height="32" rx="10" fill="#ebe9e3"/>
    <text x="1117" y="230" fill="#565d68" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">队列中 1 条消息 · 点击查看</text>

    <rect x="1102" y="264" width="200" height="58" rx="13" fill="#eceae4"/>
    <text x="1117" y="286" fill="#333942" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700">你</text>
    <text x="1117" y="305" fill="#565d68" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">比较最近三个 checkpoint。</text>
    <circle cx="1119" cy="354" r="16" fill="#242933"/>
    <path d="M1112 346h15v4h-11v7h11v4h-15z" fill="#f5f3ee"/>
    <text x="1147" y="353" fill="#20242c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700">Codex</text>
    <text x="1147" y="372" fill="#565d68" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">正在读取评估结果…</text>

    <rect x="1102" y="398" width="226" height="112" rx="14" fill="#fff4ea" stroke="#f2d2bc"/>
    <text x="1118" y="422" fill="#8d4026" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700">需要命令审批</text>
    <text x="1118" y="443" fill="#6c554b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9">读取共享结果目录</text>
    <rect x="1118" y="464" width="88" height="30" rx="9" fill="#ffffff" stroke="#dec0ae"/>
    <text x="1150" y="483" fill="#77584a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="650">拒绝</text>
    <rect x="1214" y="464" width="98" height="30" rx="9" fill="#e36a3d"/>
    <text x="1247" y="483" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="650">允许</text>

    <rect x="1102" y="642" width="226" height="58" rx="15" fill="#eeece7" stroke="#dedbd4"/>
    <text x="1118" y="676" fill="#8a8f97" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10">继续告诉 Codex…</text>
    <circle cx="1300" cy="671" r="16" fill="#e36a3d"/>
    <path d="M1293 671h13m-5-5 5 5-5 5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="1010" y="688" width="150" height="38" rx="19" fill="url(#accent)"/>
  <text x="1038" y="712" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">手机随时接力</text>
</svg>
